<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" aria-label="PlatMemoir hardcover mockup placeholder">
  <defs>
    <linearGradient id="desk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5c4033"/>
      <stop offset="100%" stop-color="#3d2b1f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8d5a3"/>
      <stop offset="50%" stop-color="#c9a227"/>
      <stop offset="100%" stop-color="#a8841f"/>
    </linearGradient>
    <linearGradient id="cover" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a3528"/>
      <stop offset="100%" stop-color="#2a1e16"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="960" height="720" fill="url(#desk)"/>
  <rect x="0" y="520" width="960" height="200" fill="#2a1e16" opacity="0.4"/>
  <!-- Laptop -->
  <g transform="translate(520 180)" filter="url(#shadow)">
    <rect x="0" y="80" width="340" height="16" rx="4" fill="#888"/>
    <rect x="20" y="0" width="300" height="188" rx="8" fill="#1a1a1a"/>
    <rect x="28" y="8" width="284" height="168" rx="4" fill="#f5f0e6"/>
    <text x="170" y="72" text-anchor="middle" fill="#3d2b1f" font-family="Georgia, serif" font-size="14" font-weight="700">Visualize Your Hardcover Memoir</text>
    <rect x="95" y="92" width="150" height="28" rx="14" fill="url(#gold)"/>
    <text x="170" y="110" text-anchor="middle" fill="#2a1e16" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Join waitlist</text>
  </g>
  <!-- Hardcover book -->
  <g transform="translate(120 140)" filter="url(#shadow)">
    <rect x="0" y="0" width="280" height="380" rx="4" fill="url(#cover)"/>
    <rect x="8" y="0" width="12" height="380" fill="#1a120c"/>
    <circle cx="140" cy="160" r="52" fill="none" stroke="url(#gold)" stroke-width="2"/>
    <path d="M140 108 L140 212 M88 160 L192 160" stroke="url(#gold)" stroke-width="1.5"/>
    <text x="140" y="260" text-anchor="middle" fill="url(#gold)" font-family="Georgia, serif" font-size="22" font-weight="700" letter-spacing="3">PLATMEMOIR</text>
    <text x="140" y="290" text-anchor="middle" fill="#e8d5a3" font-family="Georgia, serif" font-size="9" letter-spacing="1">YOUR GLOBAL ODYSSEY</text>
    <text x="140" y="340" text-anchor="middle" fill="#c9a227" font-family="system-ui, sans-serif" font-size="8" opacity="0.8">Drop hero-hardcover-mockup.jpg here</text>
  </g>
  <!-- Warm light -->
  <rect width="960" height="720" fill="url(#gold)" opacity="0.06"/>
</svg>
